{% extends "base.html" %}
{% set active_page = 'participants' %}
{% block title %}{% if participant %}编辑{% else %}新增{% endif %}参与人{% endblock %}
{% block content %}
<div class="page-head">
  <h2>{% if participant %}编辑参与人{% else %}新增参与人{% endif %}</h2>
  <a class="btn secondary" href="{{ url_for('participants.index') }}">返回</a>
</div>

<div class="card">
  <form method="post">
    <div class="field">
      <label>姓名 *</label>
      <input type="text" name="name" required value="{{ participant.name if participant else '' }}">
    </div>
    <div class="field">
      <label>证券账号</label>
      <input type="text" name="securities_account" value="{{ participant.securities_account if participant and participant.securities_account else '' }}">
    </div>
    <div class="field">
      <label>备注</label>
      <textarea name="note">{{ participant.note if participant and participant.note else '' }}</textarea>
    </div>
    <button type="submit" class="btn">保存</button>
  </form>
</div>
{% endblock %}
