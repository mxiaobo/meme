<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小博现金流工作室</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --border:#ebebeb;
  --hover:#fafafa;
  --th-bg:#f8f8f8;
  --text1:#1a1a1a;
  --text2:#666666;
  --text3:#bbbbbb;
  --accent:#fa6400;
  --up:#09b87a;
  --down:#e84646;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115;
    --card:#1a1d23;
    --border:#2a2e36;
    --hover:#222630;
    --th-bg:#1e2228;
    --text1:#e6e8ec;
    --text2:#9aa0a6;
    --text3:#5e646f;
    --accent:#fa6400;
    --up:#0fb877;
    --down:#ef4f4f;
  }
}
*{box-sizing:border-box;}
body{margin:0;padding:16px 16px 40px;background:var(--bg);color:var(--text1);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;}
header{max-width:900px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:10px;padding:20px 24px 0;box-shadow:0 2px 8px rgba(0,0,0,.07);}
h1{font-size:19px;margin:0 0 14px;font-weight:700;letter-spacing:3px;color:var(--text1);}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--border);margin:0 -24px;padding:0 24px;}
.tabs button{background:none;border:none;color:var(--text2);padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;font-family:inherit;}
.tabs button.active{color:var(--text1);border-bottom-color:var(--accent);}
.tabs button:hover{color:var(--text1);}
main{max-width:900px;margin:0 auto;padding:0;}
section{display:none;}
section.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.card h2{font-size:12px;margin:0 0 16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.grid{display:grid;gap:12px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:600px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.stat .label{font-size:11px;color:var(--text2);margin-bottom:6px;letter-spacing:.3px;}
.stat .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text1);line-height:1.1;}
.stat .sub{font-size:11px;color:var(--text3);margin-top:4px;font-variant-numeric:tabular-nums;}
.value.pos{color:var(--up);}
.value.neg{color:var(--down);}
label{display:flex;flex-direction:column;font-size:12px;color:var(--text2);margin-top:12px;gap:4px;letter-spacing:.3px;}
input,select{padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text1);width:100%;font-variant-numeric:tabular-nums;font-family:inherit;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
button.btn{padding:8px 16px;font-size:13px;font-weight:500;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;letter-spacing:.3px;}
button.btn:hover{filter:brightness(1.08);}
button.btn.ghost{background:var(--card);color:var(--text1);border:1px solid var(--border);}
button.btn.ghost:hover{background:var(--hover);filter:none;}
button.btn.danger{background:var(--down);}
button.btn.small{padding:5px 10px;font-size:12px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 12px;text-align:left;vertical-align:middle;}
th{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.3px;background:var(--th-bg);border-bottom:1px solid var(--border);}
td{color:var(--text1);border-bottom:1px solid var(--border);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
tbody tr:hover td{background:var(--hover);}
tr:last-child td{border-bottom:none;}
.muted{color:var(--text2);font-size:12px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.filters select,.filters input{width:auto;flex:1;min-width:140px;}
.empty{text-align:center;color:var(--text3);padding:32px 16px;font-size:13px;}
.hint{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5;}
.section-tabs{display:flex;gap:2px;margin-bottom:16px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--border);}
.section-tabs button{flex:1;padding:7px;border:none;background:transparent;color:var(--text2);border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;letter-spacing:.3px;}
.section-tabs button.active{background:var(--card);color:var(--text1);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.sub-list{display:none;}
.sub-list.active{display:block;}
.month-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.month-trigger-lg{padding:10px 16px;font-size:15px;font-weight:600;min-width:180px;}
table.entry-grid{margin-top:4px;}
table.entry-grid th{background:var(--th-bg);}
table.entry-grid td{padding:8px 10px;}
table.entry-grid td.ch{font-weight:500;color:var(--text1);min-width:8em;}
table.entry-grid input{padding:6px 10px;font-size:13px;}
table.entry-grid input.note{font-size:12px;}
.saved-flash{background:var(--up);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;display:none;font-weight:500;}
.saved-flash.show{display:inline-block;animation:fade 1.6s forwards;}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.ch-table{width:100%;font-size:13px;}
.ch-table th{padding:10px 12px;color:var(--text2);font-weight:600;font-size:12px;letter-spacing:.3px;background:var(--th-bg);border-bottom:1px solid var(--border);text-align:left;}
.ch-table th.num{text-align:right;}
.ch-table td{padding:12px;border-bottom:1px solid var(--border);color:var(--text1);}
.ch-table td.actions-cell{text-align:right;white-space:nowrap;}
.ch-table td.actions-cell button{margin-left:4px;}
.ch-table tr.inactive td{color:var(--text3);}
.ch-table tbody tr:last-child td{border-bottom:none;}
.add-row{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap;}
.add-row input[type="text"]{flex:1;min-width:160px;width:auto;}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.chart-head h2{margin:0;}
.chart-meta{color:var(--text2);font-size:12px;margin-bottom:12px;letter-spacing:.3px;}
.chart-meta b{color:var(--text1);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums;font-size:14px;}
.year-tabs{display:flex;gap:2px;flex-wrap:wrap;}
.year-tabs button{padding:5px 12px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text2);cursor:pointer;font-weight:500;font-family:inherit;letter-spacing:.3px;}
.year-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.year-tabs button:hover:not(.active){background:var(--hover);color:var(--text1);}
.chart-svg{width:100%;height:auto;display:block;}
.chart-svg .bar{fill:var(--accent);}
.chart-svg .chart-val{font-size:11px;fill:var(--text1);font-weight:600;font-variant-numeric:tabular-nums;}
.chart-svg .chart-lbl{font-size:11px;fill:var(--text2);}
.month-trigger{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--text1);cursor:pointer;font-family:inherit;min-width:140px;text-align:left;font-variant-numeric:tabular-nums;}
.month-trigger:hover{border-color:var(--accent);}
.month-trigger:focus{outline:none;border-color:var(--accent);}
.month-popup{position:absolute;z-index:100;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:12px 16px;min-width:280px;}
.month-popup[hidden]{display:none;}
.mp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.mp-year{font-size:15px;font-weight:700;color:var(--text1);letter-spacing:1px;}
.mp-nav{background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px 12px;color:var(--text2);font-family:inherit;border-radius:4px;}
.mp-nav:hover{color:var(--text1);background:var(--hover);}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}
.mp-month{background:none;border:none;cursor:pointer;padding:14px 0 18px;font-size:13px;color:var(--text3);border-radius:6px;position:relative;font-family:inherit;font-variant-numeric:tabular-nums;}
.mp-month:hover{background:var(--hover);color:var(--text1);}
.mp-month.selected{color:var(--text1);font-weight:700;}
.mp-month.has-data::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:var(--accent);border-radius:50%;}
.mp-foot{margin-top:6px;border-top:1px solid var(--border);padding-top:6px;text-align:center;}
.mp-foot[hidden]{display:none;}
.mp-all{background:none;border:none;cursor:pointer;color:var(--text2);font-size:12px;padding:6px 12px;font-family:inherit;letter-spacing:.3px;border-radius:4px;}
.mp-all:hover{color:var(--accent);background:var(--hover);}
</style>
</head>
<body>
<header>
  <h1>小博现金流工作室</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="dash" class="active">仪表盘</button>
    <button data-tab="entry">月度录入</button>
    <button data-tab="detail">明细</button>
    <button data-tab="settings">设置</button>
  </nav>
</header>

<main>
  <!-- DASHBOARD -->
  <section id="tab-dash" class="active">
    <div class="card">
      <h2>概览（USD）</h2>
      <div class="grid grid-4">
        <div class="stat"><div class="label">本月收入</div><div class="value pos" id="s-month"></div><div class="sub" id="s-month-sub"></div></div>
        <div class="stat"><div class="label">YTD 收入</div><div class="value pos" id="s-ytd"></div></div>
        <div class="stat"><div class="label">JEPQ 累计定投</div><div class="value" id="s-jepq"></div><div class="sub" id="s-jepq-sub"></div></div>
        <div class="stat"><div class="label">本月净现金流</div><div class="value" id="s-net"></div><div class="sub">收入 − 定投</div></div>
      </div>
    </div>
    <div class="card">
      <div class="chart-head">
        <h2 style="margin:0;">月度收入</h2>
        <div class="year-tabs" id="year-tabs"></div>
      </div>
      <div class="chart-meta"><span id="chart-period-label"></span>合计<b id="chart-total">0</b></div>
      <div id="chart-canvas"></div>
    </div>
    <div class="card">
      <h2>各渠道本月表现</h2>
      <div style="overflow-x:auto;">
        <table class="ch-table">
          <thead><tr>
            <th>渠道</th>
            <th class="num">本月</th>
            <th class="num">YTD</th>
          </tr></thead>
          <tbody id="dash-channels"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ENTRY (monthly grid) -->
  <section id="tab-entry">
    <div class="card">
      <div class="month-head">
        <button type="button" class="month-trigger month-trigger-lg" id="entry-month"></button>
        <span id="entry-flash" class="saved-flash">已保存</span>
      </div>
      <p class="hint">一次性填完本月各渠道的收入。留空 = 删除该月此渠道的记录。</p>

      <div style="overflow-x:auto;">
        <table class="entry-grid" id="entry-table">
          <thead><tr>
            <th>渠道</th>
            <th class="num">本月收入 (USD)</th>
            <th>备注</th>
          </tr></thead>
          <tbody id="entry-rows"></tbody>
        </table>
      </div>

      <label style="max-width:320px;">JEPQ 本月定投金额 (USD)
        <input type="number" id="entry-jepq" step="0.01" min="0" placeholder="0">
      </label>
      <label style="max-width:320px;">JEPQ 备注（可选）
        <input type="text" id="entry-jepq-note" placeholder="">
      </label>

      <div class="actions">
        <button class="btn" id="entry-save">保存本月数据</button>
        <button class="btn ghost" id="entry-reset">重新加载本月</button>
      </div>
    </div>
  </section>

  <!-- DETAILS -->
  <section id="tab-detail">
    <div class="card">
      <div class="section-tabs" id="detail-tabs">
        <button data-list="incomes" class="active">收入</button>
        <button data-list="jepq">JEPQ 定投</button>
      </div>
      <div class="filters">
        <button type="button" class="month-trigger" id="f-month"></button>
        <select id="f-channel"><option value="">全部渠道</option></select>
        <button class="btn ghost small" id="f-clear">清除筛选</button>
      </div>
      <div id="list-incomes" class="sub-list active"></div>
      <div id="list-jepq" class="sub-list"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings">
    <div class="card">
      <h2>渠道</h2>
      <div style="overflow-x:auto;">
        <table class="ch-table">
          <thead><tr>
            <th>名称</th>
            <th class="num">本月收入</th>
            <th></th>
          </tr></thead>
          <tbody id="channel-list"></tbody>
        </table>
      </div>
      <form id="channel-form" class="add-row">
        <input type="text" name="name" placeholder="新渠道名称" required>
        <button type="submit" class="btn">新增</button>
      </form>
    </div>
    <div class="card">
      <h2>数据备份</h2>
      <div class="actions">
        <button class="btn ghost" id="btn-export">导出 JSON</button>
        <button class="btn ghost" id="btn-import">导入 JSON</button>
        <input type="file" id="file-import" accept="application/json" style="display:none;">
        <button class="btn danger" id="btn-clear">清空全部数据</button>
      </div>
      <p class="hint">所有数据存在浏览器的 localStorage 里。换机器或清缓存前记得导出。</p>
    </div>
  </section>
</main>

<div class="month-popup" id="month-popup" hidden>
  <div class="mp-head">
    <button type="button" class="mp-nav" data-nav="-1">‹</button>
    <div class="mp-year"></div>
    <button type="button" class="mp-nav" data-nav="1">›</button>
  </div>
  <div class="mp-grid"></div>
  <div class="mp-foot" hidden>
    <button type="button" class="mp-all">全部月份</button>
  </div>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

// ===== Storage =====
const KEYS={channels:'studio_channels',incomes:'studio_incomes',jepq:'studio_jepq'};
const DEFAULT_CHANNELS=[
  {id:'ch-div',name:'股息',active:true},
  {id:'ch-ipo',name:'港股打新',active:true},
  {id:'ch-bfx',name:'Bitfinex 放贷',active:true},
  {id:'ch-w3',name:'Web3 收入',active:true}
];
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch{return d;}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

let channels=load(KEYS.channels,null);
if(!channels){channels=DEFAULT_CHANNELS;save(KEYS.channels,channels);}
let incomes=load(KEYS.incomes,[]);
let jepq=load(KEYS.jepq,[]);

// --- migrations ---
function migrate(){
  // older formats kept date+currency+fx_rate; collapse into month+amount(USD)
  const migIncome=(a)=>a.map(x=>x.month?x:({
    id:x.id,channel_id:x.channel_id,month:(x.date||'').slice(0,7),
    amount:(+x.amount)*(+x.fx_rate||1),note:x.note||''
  }));
  const migJepq=(a)=>a.map(x=>x.month?x:({
    id:x.id,month:(x.date||'').slice(0,7),amount:+x.amount||0,note:x.note||''
  }));
  if(incomes.some(x=>x.month===undefined)){incomes=migIncome(incomes);save(KEYS.incomes,incomes);}
  if(jepq.some(x=>x.month===undefined)){jepq=migJepq(jepq);save(KEYS.jepq,jepq);}
  // drop deprecated keys
  localStorage.removeItem('studio_fx');
  localStorage.removeItem('studio_principals');
  // channels: drop obsolete fields
  let chChanged=false;
  channels.forEach(c=>{
    if('category' in c){delete c.category;chChanged=true;}
    if('requires_principal' in c){delete c.requires_principal;chChanged=true;}
  });
  if(chChanged)save(KEYS.channels,channels);
}
migrate();

// ===== Utils =====
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowMonth=()=>new Date().toISOString().slice(0,7);
const thisMonth=nowMonth();
const thisYear=thisMonth.slice(0,4);
const fmtUSD=(n)=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const channelById=(id)=>channels.find(c=>c.id===id);

// ===== Tabs =====
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]');if(!b)return;
  if(typeof closeMonthPicker==='function')closeMonthPicker();
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+b.dataset.tab));
  if(b.dataset.tab==='dash')renderDash();
  if(b.dataset.tab==='entry')renderEntry();
  if(b.dataset.tab==='settings')renderChannels();
  if(b.dataset.tab==='detail')renderDetail();
});

// ===== Monthly Entry =====
const entryMonthInp=document.getElementById('entry-month');
entryMonthInp.dataset.allowAll='false';
document.getElementById('entry-reset').addEventListener('click',renderEntry);
document.getElementById('entry-save').addEventListener('click',saveEntry);
entryMonthInp.addEventListener('click',e=>{
  e.stopPropagation();
  if(activePicker&&activePicker.trigger===entryMonthInp){closeMonthPicker();return;}
  openMonthPicker(entryMonthInp,{allowAll:false,markedMonths:monthsWithData(),onChange:renderEntry});
});

function renderEntry(){
  const m=entryMonthInp.dataset.value||thisMonth;
  const tbody=document.getElementById('entry-rows');
  const findInc=(chId)=>incomes.find(x=>x.channel_id===chId&&x.month===m);
  const activeCh=channels.filter(c=>c.active);
  tbody.innerHTML=activeCh.map(c=>{
    const inc=findInc(c.id);
    const note=inc?.note||'';
    return `<tr data-ch="${c.id}">
      <td class="ch">${c.name}</td>
      <td class="num"><input type="number" step="0.01" class="f-inc" value="${inc?inc.amount:''}" placeholder="0"></td>
      <td><input type="text" class="note f-note" value="${note.replace(/"/g,'&quot;')}" placeholder="备注"></td>
    </tr>`;
  }).join('')||'<tr><td colspan="3" class="empty">没有启用的渠道</td></tr>';
  const jRec=jepq.find(x=>x.month===m);
  document.getElementById('entry-jepq').value=jRec?jRec.amount:'';
  document.getElementById('entry-jepq-note').value=jRec?.note||'';
}

function upsert(arr,match,record){
  const i=arr.findIndex(match);
  if(record==null){if(i>=0)arr.splice(i,1);return;}
  if(i>=0)arr[i]={...arr[i],...record};
  else arr.push({id:uid(),...record});
}
function saveEntry(){
  const m=entryMonthInp.dataset.value||thisMonth;
  document.querySelectorAll('#entry-rows tr[data-ch]').forEach(tr=>{
    const chId=tr.dataset.ch;
    const incV=tr.querySelector('.f-inc').value.trim();
    const note=tr.querySelector('.f-note').value.trim();
    if(incV==='')upsert(incomes,x=>x.channel_id===chId&&x.month===m,null);
    else upsert(incomes,x=>x.channel_id===chId&&x.month===m,{channel_id:chId,month:m,amount:+incV,note});
  });
  const jV=document.getElementById('entry-jepq').value.trim();
  const jNote=document.getElementById('entry-jepq-note').value.trim();
  if(jV==='')upsert(jepq,x=>x.month===m,null);
  else upsert(jepq,x=>x.month===m,{month:m,amount:+jV,note:jNote});
  save(KEYS.incomes,incomes);save(KEYS.jepq,jepq);
  const flash=document.getElementById('entry-flash');flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');
  renderEntry();
}

// ===== Dashboard =====
function renderDash(){
  const monthInc=incomes.filter(x=>x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
  const ytdInc=incomes.filter(x=>x.month.startsWith(thisYear)).reduce((s,x)=>s+(+x.amount||0),0);
  const jepqTotal=jepq.reduce((s,x)=>s+(+x.amount||0),0);
  const jepqMonth=jepq.filter(x=>x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
  const net=monthInc-jepqMonth;

  document.getElementById('s-month').textContent=fmtUSD(monthInc);
  document.getElementById('s-month-sub').textContent=thisMonth;
  document.getElementById('s-ytd').textContent=fmtUSD(ytdInc);
  document.getElementById('s-jepq').textContent=fmtUSD(jepqTotal);
  document.getElementById('s-jepq-sub').textContent='本月 '+fmtUSD(jepqMonth);
  const netEl=document.getElementById('s-net');
  netEl.textContent=fmtUSD(net);
  netEl.className='value '+(net>=0?'pos':'neg');

  const box=document.getElementById('dash-channels');
  box.innerHTML=channels.filter(c=>c.active).map(c=>{
    const mInc=incomes.filter(x=>x.channel_id===c.id&&x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
    const ytd=incomes.filter(x=>x.channel_id===c.id&&x.month.startsWith(thisYear)).reduce((s,x)=>s+(+x.amount||0),0);
    return `<tr>
      <td>${c.name}</td>
      <td class="num">${fmtUSD(mInc)}</td>
      <td class="num">${fmtUSD(ytd)}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="3" class="empty">还没有启用的渠道</td></tr>';
  renderChart();
}

// ===== Monthly income chart =====
let chartView=thisYear;
function uniqueYears(){
  const s=new Set([thisYear]);
  incomes.forEach(x=>s.add(x.month.slice(0,4)));
  return [...s].sort();
}
function trailing12(endMonth){
  const [y,mo]=endMonth.split('-').map(Number);
  const arr=[];
  for(let i=11;i>=0;i--){
    const d=new Date(y,mo-1-i,1);
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return arr;
}
function renderYearTabs(){
  const tabs=document.getElementById('year-tabs');
  const yrs=uniqueYears();
  tabs.innerHTML=yrs.map(y=>`<button data-view="${y}" class="${chartView===y?'active':''}">${y}</button>`).join('')
    +`<button data-view="trailing" class="${chartView==='trailing'?'active':''}">近 12 月</button>`;
}
function renderChart(){
  renderYearTabs();
  let monthKeys,periodLabel;
  if(chartView==='trailing'){
    monthKeys=trailing12(thisMonth);
    periodLabel=`${monthKeys[0]} ~ ${monthKeys[11]} `;
  }else{
    monthKeys=Array.from({length:12},(_,i)=>`${chartView}-${String(i+1).padStart(2,'0')}`);
    periodLabel=`${chartView} 年 `;
  }
  const totals=monthKeys.map(m=>incomes.filter(x=>x.month===m).reduce((s,x)=>s+(+x.amount||0),0));
  // global max across every recorded month so bar heights are comparable between years
  const byMonth={};
  incomes.forEach(x=>{byMonth[x.month]=(byMonth[x.month]||0)+(+x.amount||0);});
  const max=Math.max(1,...Object.values(byMonth),...totals);
  const total=totals.reduce((a,b)=>a+b,0);
  const W=720,H=240,padL=10,padR=10,padT=28,padB=32;
  const chartW=W-padL-padR,chartH=H-padT-padB;
  const step=chartW/monthKeys.length;
  const barW=step*0.65;
  const bars=monthKeys.map((m,i)=>{
    const v=totals[i];
    const h=(v/max)*chartH;
    const x=padL+i*step+(step-barW)/2;
    const y=padT+chartH-h;
    const cx=padL+i*step+step/2;
    return `
      <text x="${cx}" y="${y-6}" text-anchor="middle" class="chart-val">${v?fmtUSD(v):''}</text>
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" class="bar"/>
      <text x="${cx}" y="${padT+chartH+18}" text-anchor="middle" class="chart-lbl">${+m.slice(5,7)}月</text>`;
  }).join('');
  document.getElementById('chart-canvas').innerHTML=
    `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
  document.getElementById('chart-period-label').textContent=periodLabel;
  document.getElementById('chart-total').textContent=fmtUSD(total);
}
document.getElementById('year-tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]');if(!b)return;
  chartView=b.dataset.view;
  renderChart();
});

// ===== Channels =====
function renderChannels(){
  const box=document.getElementById('channel-list');
  box.innerHTML=channels.map(c=>{
    const mInc=incomes.filter(x=>x.channel_id===c.id&&x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
    return `<tr${c.active?'':' class="inactive"'}>
      <td>${c.name}</td>
      <td class="num">${fmtUSD(mInc)}</td>
      <td class="actions-cell">
        <button class="btn ghost small" data-act="toggle" data-id="${c.id}">${c.active?'停用':'启用'}</button>
        <button class="btn ghost small" data-act="rename" data-id="${c.id}">改名</button>
        <button class="btn ghost small" data-act="del" data-id="${c.id}">删除</button>
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="3" class="empty">暂无渠道</td></tr>';
}
document.getElementById('channel-list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const c=channelById(b.dataset.id);if(!c)return;
  if(b.dataset.act==='toggle'){c.active=!c.active;}
  if(b.dataset.act==='rename'){const n=prompt('新名称',c.name);if(n)c.name=n.trim();}
  if(b.dataset.act==='del'){
    const hasData=incomes.some(x=>x.channel_id===c.id);
    if(hasData&&!confirm('该渠道已有流水，删除会隐藏它但保留数据。继续？'))return;
    if(!hasData&&!confirm('确认删除该渠道？'))return;
    channels=channels.filter(x=>x.id!==c.id);
  }
  save(KEYS.channels,channels);
  refreshChannelFilter();renderChannels();
});
document.getElementById('channel-form').addEventListener('submit',e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  channels.push({id:'ch-'+uid(),name:f.get('name').trim(),active:true});
  save(KEYS.channels,channels);
  e.target.reset();
  refreshChannelFilter();renderChannels();
});
function refreshChannelFilter(){
  document.getElementById('f-channel').innerHTML='<option value="">全部渠道</option>'+channels.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
function monthsWithData(){
  const s=new Set();
  incomes.forEach(x=>s.add(x.month));
  jepq.forEach(x=>s.add(x.month));
  return [...s].filter(Boolean).sort().reverse();
}
// ===== Month picker popup =====
const popup=document.getElementById('month-popup');
let activePicker=null;
function setPickerValue(btn,val){
  btn.dataset.value=val||'';
  const allowAll=btn.dataset.allowAll==='true';
  btn.textContent=val?`${val.slice(0,4)}年${+val.slice(5,7)}月`:(allowAll?'全部月份':'');
}
function openMonthPicker(trigger,opts){
  activePicker={trigger,opts};
  const v=trigger.dataset.value;
  popup.dataset.year=v?+v.slice(0,4):new Date().getFullYear();
  popup.querySelector('.mp-foot').hidden=!opts.allowAll;
  renderPopup();
  popup.hidden=false;
  // position after layout so height is known
  const rect=trigger.getBoundingClientRect();
  const h=popup.offsetHeight;
  const below=window.innerHeight-rect.bottom;
  const top=(below<h+10&&rect.top>h+10)
    ?rect.top+window.scrollY-h-4
    :rect.bottom+window.scrollY+4;
  popup.style.top=top+'px';
  popup.style.left=rect.left+window.scrollX+'px';
}
function closeMonthPicker(){popup.hidden=true;activePicker=null;}
function renderPopup(){
  if(!activePicker)return;
  const year=+popup.dataset.year;
  const sel=activePicker.trigger.dataset.value||'';
  const marks=new Set(activePicker.opts.markedMonths||[]);
  popup.querySelector('.mp-year').textContent=`${year} 年`;
  popup.querySelector('.mp-grid').innerHTML=Array.from({length:12},(_,i)=>{
    const key=`${year}-${String(i+1).padStart(2,'0')}`;
    const cls=['mp-month',sel===key?'selected':'',marks.has(key)?'has-data':''].filter(Boolean).join(' ');
    return `<button type="button" class="${cls}" data-val="${key}">${i+1}月</button>`;
  }).join('');
}
popup.addEventListener('click',e=>{
  const nav=e.target.closest('.mp-nav');
  if(nav){popup.dataset.year=+popup.dataset.year+(+nav.dataset.nav);renderPopup();return;}
  const m=e.target.closest('.mp-month');
  if(m){const v=m.dataset.val;setPickerValue(activePicker.trigger,v);activePicker.opts.onChange(v);closeMonthPicker();return;}
  if(e.target.closest('.mp-all')){setPickerValue(activePicker.trigger,'');activePicker.opts.onChange('');closeMonthPicker();}
});
document.addEventListener('click',e=>{
  if(!activePicker)return;
  if(e.target===activePicker.trigger||popup.contains(e.target))return;
  closeMonthPicker();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMonthPicker();});

// ===== Detail =====
let curList='incomes';
document.getElementById('detail-tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-list]');if(!b)return;
  curList=b.dataset.list;
  document.querySelectorAll('#detail-tabs button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.sub-list').forEach(s=>s.classList.toggle('active',s.id==='list-'+curList));
  document.getElementById('f-channel').style.display=curList==='jepq'?'none':'';
  renderDetail();
});
const fMonthBtn=document.getElementById('f-month');
fMonthBtn.dataset.allowAll='true';
setPickerValue(fMonthBtn,'');
fMonthBtn.addEventListener('click',e=>{
  e.stopPropagation();
  if(activePicker&&activePicker.trigger===fMonthBtn){closeMonthPicker();return;}
  openMonthPicker(fMonthBtn,{allowAll:true,markedMonths:monthsWithData(),onChange:renderDetail});
});
document.getElementById('f-channel').addEventListener('change',renderDetail);
document.getElementById('f-clear').addEventListener('click',()=>{setPickerValue(fMonthBtn,'');document.getElementById('f-channel').value='';renderDetail();});

let editingKind=null,editingId=null;
function renderDetail(){
  const m=fMonthBtn.dataset.value||'';
  const ch=document.getElementById('f-channel').value;
  const filt=(x)=>(!m||x.month===m)&&(!ch||x.channel_id===ch);
  const sortDesc=(a,b)=>b.month.localeCompare(a.month);
  const incRows=incomes.filter(filt).sort(sortDesc);
  const jpRows=jepq.filter(x=>!m||x.month===m).sort(sortDesc);

  document.getElementById('list-incomes').innerHTML=incRows.length?renderTable(
    'incomes',['月份','渠道','金额 USD','备注',''],incRows,
    r=>[r.month,channelById(r.channel_id)?.name||'—',r.amount,r.note||'']
  ):'<div class="empty">无记录</div>';

  document.getElementById('list-jepq').innerHTML=jpRows.length?renderTable(
    'jepq',['月份','金额 USD','备注',''],jpRows,
    r=>[r.month,r.amount,r.note||'']
  ):'<div class="empty">无记录</div>';
}
function renderTable(kind,heads,rows,cellFn){
  const numCols=new Set(['金额 USD']);
  const thead=`<thead><tr>${heads.map(h=>`<th class="${numCols.has(h)?'num':''}">${h}</th>`).join('')}</tr></thead>`;
  const trs=rows.map(r=>{
    const editing=kind===editingKind&&r.id===editingId;
    const cells=cellFn(r);
    const tds=cells.map((c,i)=>{
      const h=heads[i];
      if(editing&&h==='金额 USD')return `<td class="num"><input type="number" class="edit-amount" value="${c}" step="0.01" min="0" style="max-width:120px;text-align:right;"></td>`;
      if(editing&&h==='备注')return `<td><input type="text" class="edit-note" value="${(c||'').replace(/"/g,'&quot;')}"></td>`;
      return `<td class="${numCols.has(h)?'num':''}">${h==='金额 USD'?fmtUSD(c):c}</td>`;
    }).join('');
    const actCell=editing
      ? `<td class="actions-cell">
          <button class="btn small" data-act="save" data-kind="${kind}" data-id="${r.id}">保存</button>
          <button class="btn danger small" data-act="del" data-kind="${kind}" data-id="${r.id}">删除</button>
          <button class="btn ghost small" data-act="cancel">取消</button>
        </td>`
      : `<td class="actions-cell"><button class="btn ghost small" data-act="edit" data-kind="${kind}" data-id="${r.id}">修改</button></td>`;
    return `<tr>${tds}${actCell}</tr>`;
  }).join('');
  return `<table>${thead}<tbody>${trs}</tbody></table>`;
}
document.querySelectorAll('.sub-list').forEach(el=>el.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const act=b.dataset.act,kind=b.dataset.kind,id=b.dataset.id;
  if(act==='edit'){editingKind=kind;editingId=id;renderDetail();return;}
  if(act==='cancel'){editingKind=null;editingId=null;renderDetail();return;}
  if(act==='save'){
    const row=b.closest('tr');
    const amt=parseFloat(row.querySelector('.edit-amount').value);
    const note=row.querySelector('.edit-note').value.trim();
    if(!(amt>=0)){alert('请输入有效金额');return;}
    const arr=kind==='incomes'?incomes:jepq;
    const r=arr.find(x=>x.id===id);
    if(r){r.amount=amt;r.note=note;save(KEYS[kind],arr);}
    editingKind=null;editingId=null;renderDetail();
    return;
  }
  if(act==='del'){
    if(!confirm('删除这条记录？'))return;
    if(kind==='incomes')incomes=incomes.filter(x=>x.id!==id);
    else jepq=jepq.filter(x=>x.id!==id);
    save(KEYS[kind],kind==='incomes'?incomes:jepq);
    editingKind=null;editingId=null;renderDetail();
  }
}));

// ===== Backup =====
document.getElementById('btn-export').addEventListener('click',()=>{
  const data={channels,incomes,jepq,exported_at:new Date().toISOString(),version:4};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`studio-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
});
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!confirm('导入会覆盖当前数据，确认继续？'))return;
      if(Array.isArray(d.channels))channels=d.channels;
      if(Array.isArray(d.incomes))incomes=d.incomes;
      if(Array.isArray(d.jepq))jepq=d.jepq;
      save(KEYS.channels,channels);save(KEYS.incomes,incomes);save(KEYS.jepq,jepq);
      migrate();
      refreshChannelFilter();renderDash();renderChannels();renderDetail();renderEntry();
      alert('已导入');
    }catch(err){alert('文件格式不对：'+err.message);}
  };
  r.readAsText(f);
});
document.getElementById('btn-clear').addEventListener('click',()=>{
  if(!confirm('将清空所有记录和自定义渠道，此操作不可撤销。确认？'))return;
  if(!confirm('再次确认：真的清空全部数据？'))return;
  Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
  localStorage.removeItem('studio_principals');
  localStorage.removeItem('studio_fx');
  localStorage.removeItem('studio_v');
  location.reload();
});

// ===== Init =====
setPickerValue(entryMonthInp,thisMonth);
refreshChannelFilter();
renderEntry();
renderDash();
</script>
