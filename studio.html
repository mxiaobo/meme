<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小博现金流工作室</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11;
  --card:#1e1f23;
  --card-2:#24262b;
  --border:#2b2d33;
  --text:#e8e9ea;
  --muted:#9aa0a6;
  --accent:#3b82f6;
  --green:#10b981;
  --red:#ef4444;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --card-2:#f0f2f5;
    --border:#e4e6eb;
    --text:#1f2328;
    --muted:#6b7280;
    --accent:#2563eb;
    --green:#059669;
    --red:#dc2626;
  }
}
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;}
header{padding:1rem 1rem .5rem;max-width:900px;margin:0 auto;}
h1{font-size:1.3rem;margin:0 0 .75rem;font-weight:700;}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--border);}
.tabs button{background:none;border:none;color:var(--muted);padding:.6rem .9rem;font-size:.9rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
main{max-width:900px;margin:0 auto;padding:1rem;}
section{display:none;}
section.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:1rem;}
.card h2{font-size:1rem;margin:0 0 .75rem;font-weight:600;}
.grid{display:grid;gap:.75rem;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:600px){.grid-3{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--card-2);border-radius:10px;padding:.8rem .9rem;}
.stat .label{font-size:.75rem;color:var(--muted);margin-bottom:.25rem;}
.stat .value{font-size:1.2rem;font-weight:600;}
.stat .sub{font-size:.7rem;color:var(--muted);margin-top:.2rem;}
.value.pos{color:var(--green);}
.value.neg{color:var(--red);}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);margin-top:.75rem;gap:.3rem;}
input,select{padding:.55rem .7rem;font-size:.95rem;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);width:100%;font-variant-numeric:tabular-nums;}
input:focus,select:focus{outline:none;border-color:var(--accent);}
.row{display:flex;gap:.6rem;}
.row > label{flex:1;}
button.btn{padding:.6rem 1rem;font-size:.95rem;font-weight:500;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;}
button.btn:hover{filter:brightness(1.1);}
button.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
button.btn.danger{background:var(--red);}
button.btn.small{padding:.35rem .6rem;font-size:.8rem;}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{padding:.5rem .45rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
th{font-size:.75rem;color:var(--muted);font-weight:500;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:none;}
.muted{color:var(--muted);font-size:.8rem;}
.channel-row{display:flex;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--border);gap:.5rem;flex-wrap:wrap;}
.channel-row:last-child{border-bottom:none;}
.channel-row .name{font-weight:500;}
.channel-row .stats{display:flex;gap:1rem;font-size:.8rem;color:var(--muted);}
.channel-row .stats b{color:var(--text);font-weight:600;}
.ch-table{width:100%;font-size:.88rem;}
.ch-table th{padding:.45rem .5rem;color:var(--muted);font-weight:500;font-size:.75rem;border-bottom:1px solid var(--border);}
.ch-table td{padding:.6rem .5rem;border-bottom:1px solid var(--border);}
.ch-table tbody tr:last-child td{border-bottom:none;}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.25rem;}
.chart-meta{color:var(--muted);font-size:.8rem;margin-bottom:.5rem;}
.chart-meta b{color:var(--text);font-weight:600;margin-left:.35rem;}
.year-tabs{display:flex;gap:.25rem;flex-wrap:wrap;}
.year-tabs button{padding:.3rem .7rem;font-size:.78rem;border:none;border-radius:6px;background:var(--card-2);color:var(--muted);cursor:pointer;font-weight:500;}
.year-tabs button.active{background:var(--accent);color:#fff;}
.chart-svg{width:100%;height:auto;display:block;}
.chart-svg .bar{fill:var(--accent);}
.chart-svg .chart-val{font-size:11px;fill:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
.chart-svg .chart-lbl{font-size:11px;fill:var(--muted);}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;}
.filters select,.filters input{width:auto;flex:1;min-width:140px;}
.empty{text-align:center;color:var(--muted);padding:2rem 1rem;font-size:.9rem;}
.inline-del{color:var(--red);background:none;border:none;cursor:pointer;font-size:.8rem;padding:.2rem .4rem;}
.hint{font-size:.75rem;color:var(--muted);margin-top:.3rem;}
.section-tabs{display:flex;gap:.25rem;margin-bottom:.75rem;background:var(--card-2);padding:.25rem;border-radius:8px;}
.section-tabs button{flex:1;padding:.4rem;border:none;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:.82rem;}
.section-tabs button.active{background:var(--card);color:var(--text);}
.sub-list{display:none;}
.sub-list.active{display:block;}
.month-head{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;flex-wrap:wrap;}
.month-head input{max-width:180px;}
table.entry-grid td{padding:.35rem .35rem;}
table.entry-grid td.ch{font-weight:500;color:var(--text);min-width:8em;}
table.entry-grid input{padding:.4rem .55rem;font-size:.9rem;}
table.entry-grid input.note{font-size:.8rem;}
.saved-flash{background:var(--green);color:#fff;padding:.5rem .8rem;border-radius:6px;font-size:.85rem;display:none;}
.saved-flash.show{display:inline-block;animation:fade 1.6s forwards;}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<header>
  <h1>小博现金流工作室</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="dash" class="active">仪表盘</button>
    <button data-tab="entry">月度录入</button>
    <button data-tab="channels">渠道</button>
    <button data-tab="detail">明细</button>
    <button data-tab="settings">设置</button>
  </nav>
</header>

<main>
  <!-- DASHBOARD -->
  <section id="tab-dash" class="active">
    <div class="card">
      <h2>概览（USD）</h2>
      <div class="grid grid-3">
        <div class="stat"><div class="label">本月收入</div><div class="value pos" id="s-month"></div><div class="sub" id="s-month-sub"></div></div>
        <div class="stat"><div class="label">YTD 收入</div><div class="value pos" id="s-ytd"></div></div>
        <div class="stat"><div class="label">当前占用本金</div><div class="value" id="s-principal"></div></div>
        <div class="stat"><div class="label">综合简单年化</div><div class="value" id="s-apy"></div><div class="sub">本月收入 × 12 / 本金</div></div>
        <div class="stat"><div class="label">JEPQ 累计定投</div><div class="value" id="s-jepq"></div><div class="sub" id="s-jepq-sub"></div></div>
        <div class="stat"><div class="label">本月净现金流</div><div class="value" id="s-net"></div><div class="sub">收入 − 定投 − 追加本金</div></div>
      </div>
    </div>
    <div class="card">
      <div class="chart-head">
        <h2 style="margin:0;">月度收入</h2>
        <div class="year-tabs" id="year-tabs"></div>
      </div>
      <div class="chart-meta"><span id="chart-period-label"></span>合计<b id="chart-total">$0.00</b></div>
      <div id="chart-canvas"></div>
    </div>
    <div class="card">
      <h2>各渠道本月表现</h2>
      <div style="overflow-x:auto;">
        <table class="ch-table">
          <thead><tr>
            <th>渠道</th>
            <th class="num">本金</th>
            <th class="num">本月</th>
            <th class="num">YTD</th>
            <th class="num">年化</th>
          </tr></thead>
          <tbody id="dash-channels"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ENTRY (monthly grid) -->
  <section id="tab-entry">
    <div class="card">
      <div class="month-head">
        <h2 style="margin:0;">月度录入</h2>
        <label style="margin:0;flex:0 0 auto;">月份
          <input type="month" id="entry-month">
        </label>
        <span id="entry-flash" class="saved-flash">已保存</span>
      </div>
      <p class="hint">在下表里一次性填完本月各渠道的收入和本金。<b>本金 = 月末账户余额</b>，切换月份时会自动带出最近一次的本金，不变就直接保存即可。</p>

      <div style="overflow-x:auto;">
        <table class="entry-grid" id="entry-table">
          <thead><tr>
            <th>渠道</th>
            <th class="num">本月收入 (USD)</th>
            <th class="num">本金 (USD)</th>
            <th>备注</th>
          </tr></thead>
          <tbody id="entry-rows"></tbody>
        </table>
      </div>

      <label style="max-width:320px;">JEPQ 本月定投金额 (USD)
        <input type="number" id="entry-jepq" step="0.01" min="0" placeholder="0">
      </label>
      <label style="max-width:320px;">JEPQ 备注（可选）
        <input type="text" id="entry-jepq-note" placeholder="">
      </label>

      <div class="actions">
        <button class="btn" id="entry-save">保存本月数据</button>
        <button class="btn ghost" id="entry-reset">重新加载本月</button>
      </div>
    </div>
  </section>

  <!-- CHANNELS -->
  <section id="tab-channels">
    <div class="card">
      <h2>渠道列表</h2>
      <div id="channel-list"></div>
    </div>
    <div class="card">
      <h2>新增渠道</h2>
      <form id="channel-form">
        <div class="row">
          <label>名称<input type="text" name="name" required></label>
          <label>分类
            <select name="category">
              <option>股息</option><option>港股打新</option><option>Bitfinex放贷</option>
              <option>Web3</option><option>其他</option>
            </select>
          </label>
        </div>
        <label><input type="checkbox" name="requires_principal" checked style="width:auto;margin-right:.4rem;">需要投入本金（参与年化计算）</label>
        <div class="actions"><button type="submit" class="btn">添加</button></div>
      </form>
    </div>
  </section>

  <!-- DETAILS -->
  <section id="tab-detail">
    <div class="card">
      <div class="section-tabs" id="detail-tabs">
        <button data-list="incomes" class="active">收入</button>
        <button data-list="principals">本金</button>
        <button data-list="jepq">JEPQ</button>
      </div>
      <div class="filters">
        <input type="month" id="f-month">
        <select id="f-channel"><option value="">全部渠道</option></select>
        <button class="btn ghost small" id="f-clear">清除筛选</button>
      </div>
      <div id="list-incomes" class="sub-list active"></div>
      <div id="list-principals" class="sub-list"></div>
      <div id="list-jepq" class="sub-list"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings">
    <div class="card">
      <h2>数据备份</h2>
      <div class="actions">
        <button class="btn ghost" id="btn-export">导出 JSON</button>
        <button class="btn ghost" id="btn-import">导入 JSON</button>
        <input type="file" id="file-import" accept="application/json" style="display:none;">
        <button class="btn danger" id="btn-clear">清空全部数据</button>
      </div>
      <p class="hint">所有数据存在浏览器的 localStorage 里。换机器或清缓存前记得导出。</p>
    </div>
  </section>
</main>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

// ===== Storage =====
const KEYS={channels:'studio_channels',incomes:'studio_incomes',principals:'studio_principals',jepq:'studio_jepq'};
const DEFAULT_CHANNELS=[
  {id:'ch-div',name:'股息',category:'股息',requires_principal:true,active:true},
  {id:'ch-ipo',name:'港股打新',category:'港股打新',requires_principal:true,active:true},
  {id:'ch-bfx',name:'Bitfinex 放贷',category:'Bitfinex放贷',requires_principal:true,active:true},
  {id:'ch-w3',name:'Web3 收入',category:'Web3',requires_principal:false,active:true}
];
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch{return d;}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

let channels=load(KEYS.channels,null);
if(!channels){channels=DEFAULT_CHANNELS;save(KEYS.channels,channels);}
let incomes=load(KEYS.incomes,[]);
let principals=load(KEYS.principals,[]);
let jepq=load(KEYS.jepq,[]);

// --- migrations ---
const DATA_VERSION=3;
function migrate(){
  // v1 → v2: drop date+currency+fx_rate+direction → month+amount(USD); deltas
  const migIncome=(a)=>a.map(x=>x.month?x:({
    id:x.id,channel_id:x.channel_id,month:(x.date||'').slice(0,7),
    amount:(+x.amount)*(+x.fx_rate||1),note:x.note||''
  }));
  const migPrin=(a)=>a.map(x=>x.month?x:({
    id:x.id,channel_id:x.channel_id,month:(x.date||'').slice(0,7),
    amount:(+x.amount)*(+x.fx_rate||1)*(x.direction==='out'?-1:1),note:x.note||''
  }));
  const migJepq=(a)=>a.map(x=>x.month?x:({
    id:x.id,month:(x.date||'').slice(0,7),amount:+x.amount||0,note:x.note||''
  }));
  if(incomes.some(x=>x.month===undefined)){incomes=migIncome(incomes);save(KEYS.incomes,incomes);}
  if(principals.some(x=>x.month===undefined)){principals=migPrin(principals);save(KEYS.principals,principals);}
  if(jepq.some(x=>x.month===undefined)){jepq=migJepq(jepq);save(KEYS.jepq,jepq);}
  // v2 → v3: principal records change semantic from monthly delta to absolute balance
  const v=+localStorage.getItem('studio_v')||1;
  if(v<3){
    const byCh={};
    principals.forEach(p=>(byCh[p.channel_id]=byCh[p.channel_id]||[]).push(p));
    const out=[];
    Object.values(byCh).forEach(arr=>{
      arr.sort((a,b)=>a.month.localeCompare(b.month));
      let bal=0;
      arr.forEach(r=>{bal+=+r.amount||0;out.push({...r,amount:bal});});
    });
    principals=out;save(KEYS.principals,principals);
  }
  localStorage.removeItem('studio_fx');
  localStorage.setItem('studio_v',DATA_VERSION);
}
migrate();

// ===== Utils =====
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowMonth=()=>new Date().toISOString().slice(0,7);
const thisMonth=nowMonth();
const thisYear=thisMonth.slice(0,4);
const fmtUSD=(n)=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtPct=(n)=>isFinite(n)?Math.round(n*100)+'%':'—';
const channelById=(id)=>channels.find(c=>c.id===id);

// ===== Tabs =====
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('main > section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+b.dataset.tab));
  if(b.dataset.tab==='dash')renderDash();
  if(b.dataset.tab==='entry')renderEntry();
  if(b.dataset.tab==='channels')renderChannels();
  if(b.dataset.tab==='detail')renderDetail();
});

// ===== Monthly Entry =====
const entryMonthInp=document.getElementById('entry-month');
entryMonthInp.value=thisMonth;
entryMonthInp.addEventListener('change',renderEntry);
document.getElementById('entry-reset').addEventListener('click',renderEntry);
document.getElementById('entry-save').addEventListener('click',saveEntry);

function latestPrincipalAsOf(chId,month){
  const recs=principals.filter(p=>p.channel_id===chId&&p.month<=month);
  if(!recs.length)return undefined;
  return recs.sort((a,b)=>b.month.localeCompare(a.month))[0].amount;
}
function renderEntry(){
  const m=entryMonthInp.value||thisMonth;
  const tbody=document.getElementById('entry-rows');
  const findInc=(chId)=>incomes.find(x=>x.channel_id===chId&&x.month===m);
  const findPrin=(chId)=>principals.find(x=>x.channel_id===chId&&x.month===m);
  const activeCh=channels.filter(c=>c.active);
  tbody.innerHTML=activeCh.map(c=>{
    const inc=findInc(c.id),pri=findPrin(c.id);
    // principal default: exact match if exists; otherwise carry forward from latest prior month
    const carried=latestPrincipalAsOf(c.id,prevMonth(m));
    const priVal=pri?pri.amount:(carried!==undefined?carried:'');
    const note=[inc?.note,pri?.note].filter(Boolean)[0]||'';
    return `<tr data-ch="${c.id}">
      <td class="ch">${c.name}</td>
      <td class="num"><input type="number" step="0.01" class="f-inc" value="${inc?inc.amount:''}" placeholder="0"></td>
      <td class="num"><input type="number" step="0.01" class="f-pri" value="${priVal}" placeholder="0" ${c.requires_principal?'':'disabled'}></td>
      <td><input type="text" class="note f-note" value="${note.replace(/"/g,'&quot;')}" placeholder="备注"></td>
    </tr>`;
  }).join('')||'<tr><td colspan="4" class="empty">没有启用的渠道</td></tr>';
  const jRec=jepq.find(x=>x.month===m);
  document.getElementById('entry-jepq').value=jRec?jRec.amount:'';
  document.getElementById('entry-jepq-note').value=jRec?.note||'';
}
function prevMonth(m){
  const [y,mo]=m.split('-').map(Number);
  const d=new Date(y,mo-2,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function upsert(arr,match,record){
  const i=arr.findIndex(match);
  if(record==null){if(i>=0)arr.splice(i,1);return;}
  if(i>=0)arr[i]={...arr[i],...record};
  else arr.push({id:uid(),...record});
}
function saveEntry(){
  const m=entryMonthInp.value||thisMonth;
  document.querySelectorAll('#entry-rows tr[data-ch]').forEach(tr=>{
    const chId=tr.dataset.ch;
    const incV=tr.querySelector('.f-inc').value.trim();
    const priV=tr.querySelector('.f-pri').value.trim();
    const note=tr.querySelector('.f-note').value.trim();
    if(incV==='')upsert(incomes,x=>x.channel_id===chId&&x.month===m,null);
    else upsert(incomes,x=>x.channel_id===chId&&x.month===m,{channel_id:chId,month:m,amount:+incV,note});
    if(priV==='')upsert(principals,x=>x.channel_id===chId&&x.month===m,null);
    else upsert(principals,x=>x.channel_id===chId&&x.month===m,{channel_id:chId,month:m,amount:+priV,note});
  });
  const jV=document.getElementById('entry-jepq').value.trim();
  const jNote=document.getElementById('entry-jepq-note').value.trim();
  if(jV==='')upsert(jepq,x=>x.month===m,null);
  else upsert(jepq,x=>x.month===m,{month:m,amount:+jV,note:jNote});
  save(KEYS.incomes,incomes);save(KEYS.principals,principals);save(KEYS.jepq,jepq);
  const flash=document.getElementById('entry-flash');flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');
  renderEntry();
}

// ===== Dashboard =====
function principalForChannel(chId,asOfMonth){
  return latestPrincipalAsOf(chId,asOfMonth||thisMonth)??0;
}
function principalChangeInMonth(chId,month){
  const cur=latestPrincipalAsOf(chId,month);
  if(cur===undefined)return 0;
  const prev=latestPrincipalAsOf(chId,prevMonth(month));
  return cur-(prev??0);
}
function renderDash(){
  const monthInc=incomes.filter(x=>x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
  const ytdInc=incomes.filter(x=>x.month.startsWith(thisYear)).reduce((s,x)=>s+(+x.amount||0),0);
  const totalPrincipal=channels.filter(c=>c.requires_principal)
    .reduce((s,c)=>s+Math.max(0,principalForChannel(c.id,thisMonth)),0);
  const apy=totalPrincipal>0?(monthInc*12/totalPrincipal):NaN;
  const jepqTotal=jepq.reduce((s,x)=>s+(+x.amount||0),0);
  const jepqMonth=jepq.filter(x=>x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
  const principalAddMonth=channels.filter(c=>c.requires_principal)
    .reduce((s,c)=>s+principalChangeInMonth(c.id,thisMonth),0);
  const net=monthInc-jepqMonth-Math.max(0,principalAddMonth);

  document.getElementById('s-month').textContent=fmtUSD(monthInc);
  document.getElementById('s-month-sub').textContent=thisMonth;
  document.getElementById('s-ytd').textContent=fmtUSD(ytdInc);
  document.getElementById('s-principal').textContent=fmtUSD(totalPrincipal);
  const apyEl=document.getElementById('s-apy');
  apyEl.textContent=fmtPct(apy);
  apyEl.className='value '+(isFinite(apy)&&apy>0?'pos':'');
  document.getElementById('s-jepq').textContent=fmtUSD(jepqTotal);
  document.getElementById('s-jepq-sub').textContent='本月 '+fmtUSD(jepqMonth);
  const netEl=document.getElementById('s-net');
  netEl.textContent=fmtUSD(net);
  netEl.className='value '+(net>=0?'pos':'neg');

  const box=document.getElementById('dash-channels');
  box.innerHTML=channels.filter(c=>c.active).map(c=>{
    const p=principalForChannel(c.id,thisMonth);
    const mInc=incomes.filter(x=>x.channel_id===c.id&&x.month===thisMonth).reduce((s,x)=>s+(+x.amount||0),0);
    const ytd=incomes.filter(x=>x.channel_id===c.id&&x.month.startsWith(thisYear)).reduce((s,x)=>s+(+x.amount||0),0);
    const a=(c.requires_principal&&p>0)?mInc*12/p:NaN;
    return `<tr>
      <td>${c.name}</td>
      <td class="num">${fmtUSD(p)}</td>
      <td class="num">${fmtUSD(mInc)}</td>
      <td class="num">${fmtUSD(ytd)}</td>
      <td class="num">${c.requires_principal?fmtPct(a):'—'}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="5" class="empty">还没有启用的渠道</td></tr>';
  renderChart();
}

// ===== Monthly income chart =====
let chartView=thisYear;
function uniqueYears(){
  const s=new Set([thisYear]);
  incomes.forEach(x=>s.add(x.month.slice(0,4)));
  return [...s].sort();
}
function trailing12(endMonth){
  const [y,mo]=endMonth.split('-').map(Number);
  const arr=[];
  for(let i=11;i>=0;i--){
    const d=new Date(y,mo-1-i,1);
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return arr;
}
function renderYearTabs(){
  const tabs=document.getElementById('year-tabs');
  const yrs=uniqueYears();
  tabs.innerHTML=yrs.map(y=>`<button data-view="${y}" class="${chartView===y?'active':''}">${y}</button>`).join('')
    +`<button data-view="trailing" class="${chartView==='trailing'?'active':''}">近 12 月</button>`;
}
function renderChart(){
  renderYearTabs();
  let monthKeys,periodLabel;
  if(chartView==='trailing'){
    monthKeys=trailing12(thisMonth);
    periodLabel=`${monthKeys[0]} ~ ${monthKeys[11]} `;
  }else{
    monthKeys=Array.from({length:12},(_,i)=>`${chartView}-${String(i+1).padStart(2,'0')}`);
    periodLabel=`${chartView} 年 `;
  }
  const totals=monthKeys.map(m=>incomes.filter(x=>x.month===m).reduce((s,x)=>s+(+x.amount||0),0));
  const max=Math.max(1,...totals);
  const total=totals.reduce((a,b)=>a+b,0);
  const W=720,H=240,padL=10,padR=10,padT=28,padB=32;
  const chartW=W-padL-padR,chartH=H-padT-padB;
  const step=chartW/monthKeys.length;
  const barW=step*0.65;
  const bars=monthKeys.map((m,i)=>{
    const v=totals[i];
    const h=(v/max)*chartH;
    const x=padL+i*step+(step-barW)/2;
    const y=padT+chartH-h;
    const cx=padL+i*step+step/2;
    return `
      <text x="${cx}" y="${y-6}" text-anchor="middle" class="chart-val">${v?fmtUSD(v):''}</text>
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" class="bar"/>
      <text x="${cx}" y="${padT+chartH+18}" text-anchor="middle" class="chart-lbl">${+m.slice(5,7)}月</text>`;
  }).join('');
  document.getElementById('chart-canvas').innerHTML=
    `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
  document.getElementById('chart-period-label').textContent=periodLabel;
  document.getElementById('chart-total').textContent=fmtUSD(total);
}
document.getElementById('year-tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]');if(!b)return;
  chartView=b.dataset.view;
  renderChart();
});

// ===== Channels =====
function renderChannels(){
  const box=document.getElementById('channel-list');
  box.innerHTML=channels.map(c=>{
    const p=principalForChannel(c.id,thisMonth);
    return `<div class="channel-row">
      <div><span class="name">${c.name}</span></div>
      <div class="stats"><span>本金 <b>${fmtUSD(p)}</b></span></div>
      <div>
        <button class="btn ghost small" data-act="toggle" data-id="${c.id}">${c.active?'停用':'启用'}</button>
        <button class="btn ghost small" data-act="rename" data-id="${c.id}">改名</button>
        <button class="btn ghost small" data-act="del" data-id="${c.id}">删除</button>
      </div>
    </div>`;
  }).join('')||'<div class="empty">暂无渠道</div>';
}
document.getElementById('channel-list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const c=channelById(b.dataset.id);if(!c)return;
  if(b.dataset.act==='toggle'){c.active=!c.active;}
  if(b.dataset.act==='rename'){const n=prompt('新名称',c.name);if(n)c.name=n.trim();}
  if(b.dataset.act==='del'){
    const hasData=incomes.some(x=>x.channel_id===c.id)||principals.some(x=>x.channel_id===c.id);
    if(hasData&&!confirm('该渠道已有流水，删除会隐藏它但保留数据。继续？'))return;
    if(!hasData&&!confirm('确认删除该渠道？'))return;
    channels=channels.filter(x=>x.id!==c.id);
  }
  save(KEYS.channels,channels);
  refreshChannelFilter();renderChannels();
});
document.getElementById('channel-form').addEventListener('submit',e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  channels.push({id:'ch-'+uid(),name:f.get('name').trim(),category:f.get('category'),requires_principal:f.get('requires_principal')==='on',active:true});
  save(KEYS.channels,channels);
  e.target.reset();
  refreshChannelFilter();renderChannels();
});
function refreshChannelFilter(){
  document.getElementById('f-channel').innerHTML='<option value="">全部渠道</option>'+channels.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

// ===== Detail =====
let curList='incomes';
document.getElementById('detail-tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-list]');if(!b)return;
  curList=b.dataset.list;
  document.querySelectorAll('#detail-tabs button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.sub-list').forEach(s=>s.classList.toggle('active',s.id==='list-'+curList));
  document.getElementById('f-channel').style.display=curList==='jepq'?'none':'';
  renderDetail();
});
['f-month','f-channel'].forEach(id=>document.getElementById(id).addEventListener('change',renderDetail));
document.getElementById('f-clear').addEventListener('click',()=>{document.getElementById('f-month').value='';document.getElementById('f-channel').value='';renderDetail();});

function renderDetail(){
  const m=document.getElementById('f-month').value;
  const ch=document.getElementById('f-channel').value;
  const filt=(x)=>(!m||x.month===m)&&(!ch||x.channel_id===ch);
  const sortDesc=(a,b)=>b.month.localeCompare(a.month);
  const incRows=incomes.filter(filt).sort(sortDesc);
  const priRows=principals.filter(filt).sort(sortDesc);
  const jpRows=jepq.filter(x=>!m||x.month===m).sort(sortDesc);

  document.getElementById('list-incomes').innerHTML=incRows.length?tableHTML(
    ['月份','渠道','金额 USD','备注',''],
    incRows.map(r=>[r.month,channelById(r.channel_id)?.name||'—',fmtUSD(r.amount),r.note||'',delBtn('incomes',r.id)])
  ):'<div class="empty">无记录</div>';

  document.getElementById('list-principals').innerHTML=priRows.length?tableHTML(
    ['月份','渠道','金额 USD','备注',''],
    priRows.map(r=>[r.month,channelById(r.channel_id)?.name||'—',fmtUSD(r.amount),r.note||'',delBtn('principals',r.id)])
  ):'<div class="empty">无记录</div>';

  document.getElementById('list-jepq').innerHTML=jpRows.length?tableHTML(
    ['月份','金额 USD','备注',''],
    jpRows.map(r=>[r.month,fmtUSD(r.amount),r.note||'',delBtn('jepq',r.id)])
  ):'<div class="empty">无记录</div>';
}
function tableHTML(heads,rows){
  const numCols=new Set(['金额 USD']);
  return `<table><thead><tr>${heads.map(h=>`<th class="${numCols.has(h)?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${numCols.has(heads[i])?'num':''}">${c}</td>`).join('')}</tr>`).join('')
  }</tbody></table>`;
}
function delBtn(kind,id){return `<button class="inline-del" data-del="${kind}" data-id="${id}">删除</button>`;}
document.querySelectorAll('.sub-list').forEach(el=>el.addEventListener('click',e=>{
  const b=e.target.closest('button[data-del]');if(!b)return;
  if(!confirm('删除这条记录？'))return;
  const kind=b.dataset.del,id=b.dataset.id;
  if(kind==='incomes'){incomes=incomes.filter(x=>x.id!==id);save(KEYS.incomes,incomes);}
  if(kind==='principals'){principals=principals.filter(x=>x.id!==id);save(KEYS.principals,principals);}
  if(kind==='jepq'){jepq=jepq.filter(x=>x.id!==id);save(KEYS.jepq,jepq);}
  renderDetail();
}));

// ===== Backup =====
document.getElementById('btn-export').addEventListener('click',()=>{
  const data={channels,incomes,principals,jepq,exported_at:new Date().toISOString(),version:2};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`studio-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
});
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!confirm('导入会覆盖当前数据，确认继续？'))return;
      if(Array.isArray(d.channels))channels=d.channels;
      if(Array.isArray(d.incomes))incomes=d.incomes;
      if(Array.isArray(d.principals))principals=d.principals;
      if(Array.isArray(d.jepq))jepq=d.jepq;
      save(KEYS.channels,channels);save(KEYS.incomes,incomes);save(KEYS.principals,principals);save(KEYS.jepq,jepq);
      migrate();
      refreshChannelFilter();renderDash();renderChannels();renderDetail();renderEntry();
      alert('已导入');
    }catch(err){alert('文件格式不对：'+err.message);}
  };
  r.readAsText(f);
});
document.getElementById('btn-clear').addEventListener('click',()=>{
  if(!confirm('将清空所有记录和自定义渠道，此操作不可撤销。确认？'))return;
  if(!confirm('再次确认：真的清空全部数据？'))return;
  Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
  location.reload();
});

// ===== Init =====
refreshChannelFilter();
renderEntry();
renderDash();
</script>
</body>
</html>
